# BilimUz — production reverse-proxy / static-file config.
#
# Same-origin architecture (deliberate — see docs/Deployment/PRODUCTION.md):
# this server serves the built frontend AND proxies /api/v1/, /docs, and
# /api/v1/openapi.json to the backend on the SAME hostname. This matters
# because backend/app/core/security/cookies.py's refresh-token and CSRF
# cookies default to SameSite=Lax with no cross-site Domain configured —
# a split-hostname (frontend.example.com / api.example.com) deployment
# would need SameSite=None + HTTPS + REFRESH_TOKEN_COOKIE_DOMAIN set
# (see backend/README.md's Sprint 86 section) and is NOT what this file
# assumes.
#
# This file is baked into the frontend image at build time (see
# frontend/Dockerfile) as /etc/nginx/conf.d/default.conf.

# ---------------------------------------------------------------------
# HTTP server — plain port 80.
#
# As shipped, this server answers application traffic directly over
# HTTP. It does NOT terminate HTTPS and does NOT assume a certificate
# exists — doing so with a fake/self-signed cert and calling it "HTTPS"
# would be worse than being honest that TLS is not yet configured here.
#
# Two real options for HTTPS, both documented in
# docs/Deployment/PRODUCTION.md — pick one before exposing this to the
# public Internet with real user data:
#
#   1. Put this container behind a separate TLS-terminating proxy you
#      already operate (a cloud load balancer, Caddy, Traefik, another
#      nginx) that forwards plain HTTP to this container on an internal
#      network. Simplest if you already have one.
#   2. Terminate TLS in THIS container: obtain a real certificate (e.g.
#      Let's Encrypt via certbot, run as a separate one-shot/sidecar
#      container against your real domain) and mount the resulting
#      fullchain.pem/privkey.pem into this container, then uncomment
#      and adapt the commented `server { listen 443 ssl; ... }` block
#      at the bottom of this file. It is commented out, not deleted,
#      specifically so the paths are adjusted to your real certificate
#      location rather than copy-pasted with placeholder paths that
#      silently fail.
#
# Until one of those is done, every request (including login
# credentials and refresh/CSRF cookies) travels as plain HTTP. The
# backend's own cookie code (cookies.py::_is_secure) already sets
# Secure=True whenever ENVIRONMENT is "staging"/"production" — which
# means browsers will REFUSE to send those cookies back over plain
# HTTP once that's the case. In other words: this app will not
# function correctly in production until HTTPS is actually configured.
# That is intentional fail-closed behavior, not a bug to work around by
# setting ENVIRONMENT=development in production.

server {
    listen 80;
    server_name _;  # operator: replace with your real domain, e.g. bilimuz.uz

    client_max_body_size 50m;  # local-backend (STORAGE_BACKEND=local) file
                                # uploads go through the backend; R2-backend
                                # uploads (Sprint 27) go direct-to-R2 via
                                # presigned URLs and never pass through here.
                                # Raise this if you need larger local uploads.

    # --- API: proxied to the backend service, same origin -------------
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;    # generous enough for the AI Center's
        proxy_send_timeout 60s;    # real Anthropic calls (Sprint 88,
                                    # AI_REQUEST_TIMEOUT_SECONDS defaults to
                                    # 30s backend-side) without nginx
                                    # cutting the connection first.
    }

    # Swagger UI / OpenAPI schema — operator decision: proxied here for
    # convenience (matches the backend's own /docs and
    # /api/v1/openapi.json paths exactly, see backend/app/main.py). If
    # you do not want interactive API docs reachable from the public
    # Internet in production, comment out this block and restrict
    # access another way (e.g. an IP allowlist, or basic auth added
    # here).
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location = /api/v1/openapi.json {
        proxy_pass http://backend:8000/api/v1/openapi.json;
        proxy_set_header Host $host;
    }

    # --- Frontend: the built React SPA ---------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — Vite fingerprints filenames (index-ABC123.js), so
    # these are safe to cache aggressively; index.html itself is not
    # (see the location / block below), so a deploy is picked up
    # immediately without a hard-refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any path not matched above (client-side routes like
    # /student/tests/:id) is served index.html, and React Router takes
    # it from there. This is also why Sprint 89's catch-all 404 route
    # lives IN the React app (NotFoundPage.tsx), not here: nginx can't
    # tell a genuinely unmatched route from a valid client-side one.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Lightweight proxy-level health check, independent of the backend
    # (useful for a load balancer that only wants to know "is this
    # nginx container alive" without hitting the app). The backend's own
    # DB-aware health check is proxied at /api/v1/health above.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------------------------------------------------------------------
